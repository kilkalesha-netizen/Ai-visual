name: Build FluthVisual

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo files
        run: ls -la

      - name: Unzip project
        run: |
          unzip -o fluthvisual12.zip -d project
          echo "=== Содержимое project ==="
          ls -la project

      - name: Find gradlew
        run: |
          find project -name gradlew -type f

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: |
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Build with Gradle
        run: |
          cd $(find project -name gradlew -type f -exec dirname {} \; | head -n 1)
          ./gradlew build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluthVisual
          path: project/**/build/libs/*.jar
          if-no-files-found: error
